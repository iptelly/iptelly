[package]
name = "iptelly-core"
version = "0.0.0"
description = "IPTelly's sources, database, EPG, players and downloads, without any UI"
authors = ["jeffsmith82"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.91.1"

[[bench]]
name = "m3u_parse"
harness = false

[[bench]]
name = "xtream_parse"
harness = false

[dependencies]
serde_json = "1.0.145"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
anyhow = { version = "1.0.100" }
regex = { version = "1.12.2", features = ["std"] }
directories = "6.0.0"
tokio = { version = "1.48.0", features = ["full"] }
url = "2.5.7"
r2d2_sqlite = "0.25.0"
r2d2 = "0.8.10"
chrono = "0.4.42"
which = "7.0.3"
simplelog = "0.12.2"
log = "0.4.28"
rusqlite_migration = "1.3.1"
warp = "0.3.7"
if-addrs = "0.13.4"
tokio-util = "0.7.17"
indexmap = "2.12.1"
futures = "0.3.32"
quick-xml = "0.42.0"
flate2 = "1.1.10"
chrono-tz = "0.10.4"
sha2 = "0.11.0"
[target.'cfg(not(target_os = "windows"))'.dependencies]
shell-words = "1.1.0"
[target.'cfg(target_os = "windows")'.dependencies]
winsplit = "0.1.0"
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Native-tls (the reqwest default) needs a cross-compiled OpenSSL to build
# for Android/iOS, which isn't set up here - desktop keeps the default.
reqwest = { version = "0.12.24", features = ["json"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# rustls avoids needing a cross-compiled OpenSSL for mobile targets.
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["html_reports"] }
# Only for building a fake reqwest::Response in tests (reqwest's
# From<http::Response<T>> impl needs the matching http crate version).
http = "1"
pprof = { version = "0.15.0", default-features = false, features = ["flamegraph"] }
