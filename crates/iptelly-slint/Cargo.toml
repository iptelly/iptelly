[package]
name = "iptelly-slint"
version = "0.0.0"
description = "IPTelly with a Slint user interface"
edition = "2024"
rust-version = "1.91.1"
license = ""

[[bin]]
name = "iptelly-slint"
path = "src/main.rs"

[dependencies]
iptelly-core = { path = "../iptelly-core" }
slint = "1.18"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
sha2 = "0.11.0"
directories = "6.0.0"
chrono = "0.4"
# GTK3 rather than rfd's xdg-portal backend only because tauri-plugin-dialog
# (src-tauri) enables gtk3, workspace builds merge the two, and rfd refuses
# both at once. Switch to xdg-portal once src-tauri is removed. GTK's own
# file chooser still uses the portal inside the Flatpak sandbox.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
arboard = { version = "3.6", features = ["wayland-data-control"] }

[build-dependencies]
slint-build = "1.18"
