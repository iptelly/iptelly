[package]
name = "iptelly-ffi"
version = "0.0.0"
description = "iptelly-core for apps written in other languages, through uniffi"
authors = ["jeffsmith82"]
edition = "2024"
rust-version = "1.91.1"
publish = false

[lib]
# cdylib for Android's .so, staticlib for iOS and tvOS, lib for the tests.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
iptelly-core = { path = "../iptelly-core" }
anyhow = "1.0.100"
thiserror = "2"
tokio = { version = "1.48.0", features = ["rt"] }
# uniffi-bindgen-react-native only works with the uniffi version it was
# built for, so update the two together.
uniffi = { version = "0.31", features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt"] }
