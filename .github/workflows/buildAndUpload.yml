name: Build and Upload

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 2.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Fails fast, before the slow builds, on the wrong branch, a bad version
  # or one that has already been released.
  prepare:
    runs-on: ubuntu-22.04

    steps:
      - name: Check branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases can only be built from main, not '$GITHUB_REF_NAME'"
            exit 1
          fi

      # The MSI bundler only accepts plain numeric versions, so no
      # pre-release suffixes like -beta.1.
      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH (e.g. 2.1.0), got '$VERSION'"
            exit 1
          fi

      - name: Check tag doesn't exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "::error::Tag v$VERSION already exists; pick a new version"
            exit 1
          fi

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [24.x]
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Download mpv
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $nightlyPage = "https://nightly.link/mpv-player/mpv/workflows/build/master"
          $response = Invoke-WebRequest -Uri $nightlyPage -UseBasicParsing
          $latestUrl = $response.Links.Href | Where-Object { $_ -match "x86_64-pc-windows-msvc\.zip$" } | Select-Object -First 1

          $retryCount = 3
          $retryDelay = 5

          for ($i = 1; $i -le $retryCount; $i++) {
              try {
                  Invoke-WebRequest -UserAgent "Wget" -Uri $latestUrl -OutFile .\mpv.zip
                  break
              }
              catch {
                  Start-Sleep -Seconds $retryDelay
              }
          }

          New-Item -Path 'C:\iptelly-deps' -ItemType Directory -Force
          7z e .\mpv.zip -oC:\iptelly-deps mpv.exe vulkan-1.dll -y

      - name: Download ffmpeg
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $retryCount = 3
          $retryDelay = 5
          for ($i = 1; $i -le $retryCount; $i++) {
              try {
                  Invoke-WebRequest -UserAgent "Wget" -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile .\ffmpeg.zip
                  break
              }
              catch {
                  Write-Host "Error occurred: $_. Retrying in $retryDelay seconds..."
                  Start-Sleep -Seconds $retryDelay
              }
          }
          7z e .\ffmpeg.zip -oC:\iptelly-deps ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe

      - name: Download yt-dlp
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $retryCount = 3
          $retryDelay = 5
          for ($i = 1; $i -le $retryCount; $i++) {
              try {
                  Invoke-WebRequest -UserAgent "Wget" -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile yt-dlp.exe
                  break
              }
              catch {
                  Write-Host "Error occurred: $_. Retrying in $retryDelay seconds..."
                  Start-Sleep -Seconds $retryDelay
              }
          }
          Move-Item -Path yt-dlp.exe -Destination C:\iptelly-deps

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install deps linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev

      # The repo holds a 0.0.0 placeholder; the real version is only written
      # here, on the runner, and never committed back.
      - name: Set version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(conf, null, 2) + "\n");
          '
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: Install deps project
        run: |
          npm install

      - name: Build
        if: startsWith(matrix.os, 'macos-')
        run: |
          CI=true npm run tauri build

      - name: Build
        if: matrix.os == 'windows-latest'
        run: |
          npm run tauri build

      - name: Build
        if: matrix.os == 'ubuntu-22.04'
        run: |
          npm run tauri build -- --bundles deb,rpm
          
      - name: Upload MSI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: iptelly-windows-${{ inputs.version }}
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 60

      - name: Upload DEB
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: iptelly-debian-${{ inputs.version }}
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 60

      - name: Upload RPM
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: iptelly-redhat-${{ inputs.version }}
          path: src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 60

      - name: Upload DMG ARM64
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: iptelly-mac-arm64-${{ inputs.version }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 60

      - name: Upload DMG AMD64
        if: matrix.os == 'macos-13'
        uses: actions/upload-artifact@v7
        with:
          name: iptelly-mac-AMD64-${{ inputs.version }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 60

  # Only runs once every platform has built, so a tag always means a
  # complete set of artifacts exists for that version.
  tag:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Create tag v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$GITHUB_SHA"
