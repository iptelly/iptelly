name: Build and Upload

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 2.1.0"
        required: true
        type: string
      dry_run:
        description: "Build the packages but don't tag the release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Fails fast, before the slow builds, on the wrong branch, a bad version
  # or one that has already been released.
  prepare:
    runs-on: ubuntu-22.04

    steps:
      - name: Check branch
        if: ${{ !inputs.dry_run }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases can only be built from main, not '$GITHUB_REF_NAME'"
            exit 1
          fi

      # The MSI only accepts plain numeric versions, so no pre-release
      # suffixes like -beta.1.
      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH (e.g. 2.1.0), got '$VERSION'"
            exit 1
          fi

      - name: Check tag doesn't exist
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "::error::Tag v$VERSION already exists; pick a new version"
            exit 1
          fi

  linux:
    needs: prepare
    # The oldest supported Ubuntu, so the .deb's glibc requirement is low.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # dpkg-dev provides dpkg-shlibdeps, which cargo-deb uses to work out
      # the .deb's library dependencies ($auto).
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y libssl-dev libfontconfig1-dev dpkg-dev

      - name: Install packagers
        run: cargo install --locked cargo-deb cargo-generate-rpm

      # The repo holds a 0.0.0 placeholder; the real version is only written
      # here, on the runner, and never committed back.
      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" crates/iptelly/Cargo.toml
          grep -m1 '^version' crates/iptelly/Cargo.toml

      # Not --locked: setting the version also changes it in Cargo.lock.
      - name: Build
        run: cargo build --release -p iptelly

      - name: Package
        run: |
          cargo deb -p iptelly --no-build
          cargo generate-rpm -p crates/iptelly

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: iptelly-debian-${{ inputs.version }}
          path: target/debian/*.deb
          retention-days: 60

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: iptelly-redhat-${{ inputs.version }}
          path: target/generate-rpm/*.rpm
          retention-days: 60

  windows:
    needs: prepare
    # cargo-wix needs the WiX 3 toolset, which windows-2022 has installed
    # (windows-2025 doesn't).
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # mpv goes into the installer's deps folder (crates/iptelly/wix/deps.wxs),
      # where the core looks for it. ffmpeg and yt-dlp aren't bundled.
      - name: Download mpv
        shell: powershell
        run: |
          $nightlyPage = "https://nightly.link/mpv-player/mpv/workflows/build/master"
          $response = Invoke-WebRequest -Uri $nightlyPage -UseBasicParsing
          $latestUrl = $response.Links.Href | Where-Object { $_ -match "x86_64-pc-windows-msvc\.zip$" } | Select-Object -First 1

          $retryCount = 3
          $retryDelay = 5

          for ($i = 1; $i -le $retryCount; $i++) {
              try {
                  Invoke-WebRequest -UserAgent "Wget" -Uri $latestUrl -OutFile .\mpv.zip
                  break
              }
              catch {
                  Start-Sleep -Seconds $retryDelay
              }
          }

          New-Item -Path 'C:\iptelly-deps' -ItemType Directory -Force
          7z e .\mpv.zip -oC:\iptelly-deps mpv.exe vulkan-1.dll -y

      - name: Install cargo-wix
        run: cargo install --locked cargo-wix

      # See the linux job.
      - name: Set version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" crates/iptelly/Cargo.toml
          grep -m1 '^version' crates/iptelly/Cargo.toml

      - name: Build
        run: cargo build --release -p iptelly

      - name: Package
        run: cargo wix -p iptelly --no-build --nocapture

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: iptelly-windows-${{ inputs.version }}
          path: target/wix/*.msi
          retention-days: 60

  # Only runs once every platform has built, so a tag always means a
  # complete set of artifacts exists for that version.
  tag:
    needs: [linux, windows]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Create tag v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$GITHUB_SHA"
