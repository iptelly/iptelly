[package]
name = "iptelly"
version = "2.0.0"
description = "Fast And Powerful IPTV App"
authors = ["jeffsmith82"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.91.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "iptelly_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[[bench]]
name = "m3u_parse"
harness = false

[[bench]]
name = "xtream_parse"
harness = false

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
serde_json = "1.0.145"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.9.3", features = [] }
anyhow = { version = "1.0.100" }
regex = { version = "1.12.2", features = ["std"] }
directories = "6.0.0"
tokio = { version = "1.48.0", features = ["full"] }
url = "2.5.7"
r2d2_sqlite = "0.25.0"
r2d2 = "0.8.10"
bytes = "1.11.0"
tauri-plugin-dialog = "2.4.2"
chrono = "0.4.42"
which = "7.0.3"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-shell = "2.3.3"
simplelog = "0.12.2"
log = "0.4.28"
rusqlite_migration = "1.3.1"
base64 = "0.22.1"
tauri-plugin-notification = "2.3.3"
warp = "0.3.7"
if-addrs = "0.13.4"
tokio-util = "0.7.17"
indexmap = "2.12.1"
futures = "0.3.32"
quick-xml = "0.42.0"
flate2 = "1.1.10"
chrono-tz = "0.10.4"
sha2 = "0.11.0"
tauri-plugin-window-state = "2.5.0"
[target.'cfg(not(target_os = "windows"))'.dependencies]
shell-words = "1.1.0"
[target.'cfg(target_os = "windows")'.dependencies]
winsplit = "0.1.0"
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.3.6"
# Native-tls (the reqwest default) needs a cross-compiled OpenSSL to build
# for Android/iOS, which isn't set up here - desktop keeps the default.
reqwest = { version = "0.12.24", features = ["json"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# rustls avoids needing a cross-compiled OpenSSL for mobile targets.
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri = { version = "2.9.3", features = ["tray-icon"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["html_reports"] }
# Only for building a fake reqwest::Response in tests (reqwest's
# From<http::Response<T>> impl needs the matching http crate version).
http = "1"
pprof = { version = "0.15.0", default-features = false, features = ["flamegraph"] }
