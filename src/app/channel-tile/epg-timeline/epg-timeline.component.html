<div class="epg-timeline">
  @if (fetched && epgs.length > 0) {
    @for (epg of epgs; track epg; let i = $index) {
      <div class="epg-block" [ngbTooltip]="tooltip(epg)" container="body"
        [ngClass]="{ 'now-playing': isNowPlaying(epg), focused: i === focusedIndex }" [style.left.%]="leftPercent(epg)"
        [style.width.%]="widthPercent(epg)" (click)="onProgrammeClick(epg, $event)">
        <span class="epg-title">{{ epg.title }}</span>
      </div>
    }
    @if (showNowLine()) {
      <div class="now-line" [style.left.%]="nowPercent()"></div>
    }
  }
  @if (fetched && epgs.length === 0) {
    <div class="epg-empty">No EPG data</div>
  }
</div>
