<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fred TV</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tauri only injects security.csp (tauri.conf.json) into the HTML it
         serves via its custom protocol in production builds. `tauri dev`
         loads straight from the ng serve dev server instead, bypassing that
         injection, so this mirrors the same policy here to also cover dev. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; connect-src 'self' https: blob:; media-src 'self' https: blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
